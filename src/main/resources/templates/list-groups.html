
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>List Study Groups</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.css">
</head>

<body>

<div class="container">

    <h3>List Study Groups</h3>
    <hr/>

    <a th:href="@{/addGroupForm}"
       class="btn btn-primary">
        Add Group
    </a>

    <br/><br/>

    <table class="table table-bordered table-striped"
           id="groupTable">

        <thead>
        <tr>
            <th>Group Name</th>
            <th>Faculty</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="group : ${groups}">

            <td th:text="${group.name}"></td>

            <td th:text="${group.faculty}"></td>

            <td th:text="${group.course}"></td>

            <td>
                <a th:href="@{/showGroupUpdateForm(groupId=${group.id})}"
                   class="btn btn-info">
                    Update
                </a>

                <a th:href="@{/deleteGroup(groupId=${group.id})}"
                   class="btn btn-danger ml-2"
                   onclick="return confirm('Delete this group?')">
                    Delete
                </a>
            </td>

        </tr>
        </tbody>

    </table>

    <hr/>

    <a th:href="@{/list}">
        Back to Students
    </a>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>

<script>
    $(document).ready(function() {
        $("#groupTable").DataTable({
            'aoColumnDefs': [{
                'bSortable': false,
                'aTargets': [-1]
            }]
        });
    });
</script>

</body>
</html>
